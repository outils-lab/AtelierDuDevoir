<title>Dictée — Homophones on/ont et son/sont – CE2</title>

<body>
<script>
window.FICHE = {
  code:'DM213', niveau:'CE2', matiere:'Français', categorie:'Dictées mots',
  duree:'15 min', retour:'ce2.html',
  accent:'#4f46e5', accent2:'#6366f1', accentLight:'#eef2ff', accentMid:'#c7d2fe',
  titre:'Dictée : on/ont et son/sont',
  ugoIntro:"Quatre petits mots, deux pi\u00e8ges !<br>Teste chaque mot avant de l\'\u00e9crire. \u{1F9E0}",
  msgBrillant:'Tu ne confonds plus on/ont ni son/sont !',

  lecon:[
    { titre:'\u{1F4D6} Rappel : on ou ont ?',
      html:'<div class="compare-grid">'
        +'<div class="compare-card" style="border-color:#4f46e5;background:#eef2ff;">'
        +'<h4 style="color:#4f46e5;">on</h4><p><strong>Pronom sujet</strong>.</p>'
        +'<p style="margin-top:6px;">On peut dire <em>nous</em>.<br><em><strong>On</strong> joue dehors.</em></p></div>'
        +'<div class="compare-card" style="border-color:#c2410c;background:#fff7ed;">'
        +'<h4 style="color:#c2410c;">ont</h4><p>Verbe <strong>avoir</strong> (ils/elles).</p>'
        +'<p style="margin-top:6px;">On peut dire <em>avaient</em>.<br><em>Ils <strong>ont</strong> faim.</em></p></div></div>',
      ugo:'Le test : remplace par <em>avaient</em>. Si ça marche, c\'est <strong>ont</strong> !' },

    { titre:'\u{1F4D6} Rappel : son ou sont ?',
      html:'<div class="compare-grid">'
        +'<div class="compare-card" style="border-color:#15803d;background:#f0fdf4;">'
        +'<h4 style="color:#15803d;">son</h4><p><strong>Déterminant</strong> possessif.</p>'
        +'<p style="margin-top:6px;">On peut dire <em>mon</em> ou <em>ton</em>.<br><em><strong>son</strong> vélo</em></p></div>'
        +'<div class="compare-card" style="border-color:#be123c;background:#fff1f2;">'
        +'<h4 style="color:#be123c;">sont</h4><p>Verbe <strong>être</strong> (ils/elles).</p>'
        +'<p style="margin-top:6px;">On peut dire <em>étaient</em>.<br><em>Ils <strong>sont</strong> prêts.</em></p></div></div>',
      ugo:'Même méthode : <em>étaient</em> pour <strong>sont</strong>, <em>mon</em> pour <strong>son</strong>.' },

    { titre:'\u{1F511} La méthode en dictée',
      html:'<div class="astuce">\u{1F4A1} Quand tu entends [on] ou [son], arrête-toi une seconde :<br><br>'
        +'\u2022 <em>nous</em> ? \u2192 <strong>on</strong> &nbsp;|&nbsp; <em>avaient</em> ? \u2192 <strong>ont</strong><br>'
        +'\u2022 <em>mon</em> ? \u2192 <strong>son</strong> &nbsp;|&nbsp; <em>étaient</em> ? \u2192 <strong>sont</strong></div>'
        +'<div class="exemple">\u{1F4CC} <em><strong>On</strong> a vu ses parents : ils <strong>sont</strong> venus '
        +'chercher <strong>son</strong> cartable.</em><br>'
        +'On = nous \u2714 &nbsp;|&nbsp; sont = étaient \u2714 &nbsp;|&nbsp; son = mon \u2714</div>' }
  ],

  memo:'\u{1F535} <strong>on</strong> = nous &nbsp;|&nbsp; \u{1F7E0} <strong>ont</strong> = avaient<br>'
      +'\u{1F7E2} <strong>son</strong> = mon/ton &nbsp;|&nbsp; \u{1F534} <strong>sont</strong> = étaient<br>'
      +'\u{1F4A1} Les mots en -t (ont, sont) sont toujours des verbes !',

  exercices:[
    { type:'dictee', titre:'Écris les phrases', consigne:'Écoute la phrase entière, puis écris-la.',
      large:true,
      items:[
        { rep:"On part en vacances.", lu:'On part en vacances. point',
          expl:'<em>Nous</em> partons \u2192 <strong>On</strong>, pronom sujet.' },
        { rep:"Les enfants ont soif.", lu:'Les enfants ont soif. point',
          expl:'Les enfants <em>avaient</em> soif \u2192 <strong>ont</strong>, verbe avoir.' },
        { rep:"Tom range son cartable.", lu:'Tom range son cartable. point',
          expl:'<em>mon</em> cartable \u2192 <strong>son</strong>, déterminant.' }
      ]},
    { type:'dictee', titre:'Attention, plusieurs pièges !', consigne:'Chaque phrase contient deux mots à surveiller.',
      large:true,
      items:[
        { rep:"Mes amis sont dans son jardin.", lu:'Mes amis sont dans son jardin. point',
          expl:'<em>étaient</em> \u2192 <strong>sont</strong>. Puis <em>mon</em> jardin \u2192 <strong>son</strong>.' },
        { rep:"On sait que ses parents ont raison.", lu:"On sait que ses parents ont raison. point",
          expl:'<em>Nous</em> savons \u2192 <strong>On</strong>. Ses parents <em>avaient</em> raison \u2192 <strong>ont</strong>.' }
      ]}
  ]
};
</script>
