window.FICHE = {

  titre:'son ou sont ?',

  lecon:[
    { titre:'\u{1F4D6} Bloc 1 — Deux mots, deux rôles',

        +'<h4 style="color:#15803d;">\u{1F7E2} son</h4>'
        +'<p>C\'est un <strong>déterminant possessif</strong>. Il montre à qui appartient quelque chose.</p>'
        +'<p style="margin-top:6px;"><em><strong>son</strong> vélo · <strong>son</strong> cartable · <strong>son</strong> frère</em></p></div>'
        +'<div class="compare-card" style="border-color:#b45309;background:#fffbeb;">'
        +'<h4 style="color:#b45309;">\u{1F7E0} sont</h4>'
        +'<p>C\'est le verbe <strong>être</strong> conjugué avec ils / elles.</p>'
        +'<p style="margin-top:6px;"><em>Ils <strong>sont</strong> contents · Elles <strong>sont</strong> parties</em></p></div></div>',
      ugo:'<strong>son</strong> se place devant un nom (son vélo). <strong>sont</strong> se place après ils ou elles. Deux rôles bien différents !',
      questions:[
        { q:'Que montre le mot « son » ?', options:['à qui appartient une chose','une action'],

          expl:'« son » est un déterminant possessif : son vélo, son cartable.' },
        { q:'« sont » est le verbe :', options:['être','avoir','aller'],
          bonne:'être',
          expl:'« sont » est le verbe être avec ils ou elles.' },
        { q:'Où se place « sont » ?', options:['après ils ou elles','devant un nom'],
          bonne:'après ils ou elles',
          expl:'Ils sont contents · Elles sont parties.' }
      ] },

    { titre:'\u{1F4D6} Bloc 2 — L\'astuce du remplacement',
      html:'<p>Essaie de remplacer par <span class="highlight">étaient</span>. Si ça marche, c\'est <strong>sont</strong>.</p>'

        +'<div class="astuce">\u{1F4A1} Autre astuce pour <strong>son</strong> : tu peux le remplacer par <strong>mon</strong> ou <strong>ton</strong>.<br>'
        +'<em>son vélo \u2192 mon vélo \u2714</em> &nbsp;|&nbsp; <em>ils sont \u2192 ils mon \u2718</em></div>',
      ugo:'Deux astuces valent mieux qu\'une ! <em>étaient</em> pour <strong>sont</strong>, <em>mon</em> ou <em>ton</em> pour <strong>son</strong>.',
      questions:[
        { q:'Par quel mot remplace-t-on « sont » pour vérifier ?',
          options:['étaient','mon'],
          bonne:'étaient',
          expl:'Si « étaient » fonctionne, on écrit sont.' },
        { q:'Par quels mots peut-on remplacer « son » ?',
          options:['mon ou ton','étaient'],
          bonne:'mon ou ton',
          expl:'son vélo → mon vélo, ça marche !' },
        { q:'« Il prend ___ goûter » : quelle astuce marche ?',
          options:['mon goûter','étaient goûter'],
          bonne:'mon goûter',
          expl:'On peut dire « mon goûter », donc on écrit son.' }
      ] },

    { titre:'\u{1F511} Bloc 3 — Récapitulons',
      html:'<div class="exemple">'
        +'\u{1F7E2} <strong>son</strong> \u2192 devant un nom · remplaçable par <em>mon</em>/<em>ton</em><br>'

        +'\u{1F7E0} <strong>sont</strong> \u2192 après ils/elles · remplaçable par <em>étaient</em><br>'
        +'&nbsp;&nbsp;&nbsp;&nbsp;<em>ils sont là · elles sont grandes</em></div>'
        +'<div class="astuce">\u26A0\uFE0F Attention : on peut trouver les deux dans la même phrase !<br>'
        +'<em>Ses parents <strong>sont</strong> venus chercher <strong>son</strong> cartable.</em></div>',
      questions:[
        { q:'« son » se place :', options:['devant un nom','après ils'],
          bonne:'devant un nom',
          expl:'son livre, son chien, son école.' },
        { q:'Peut-on trouver les deux mots dans la même phrase ?',
          options:['oui','non'],
          bonne:'oui',
          expl:'Ses parents sont venus chercher son cartable.' },
        { q:'« Elles ___ grandes » : que faut-il écrire ?',
          options:['sont','son'],
          bonne:'sont',
          expl:'Elles étaient grandes → verbe être → sont.' }
      ] }
  ],

  memo:'\u{1F7E2} <strong>son</strong> = déterminant possessif \u2192 remplaçable par <em>mon</em> ou <em>ton</em><br>'
      +'&nbsp;&nbsp;&nbsp;&nbsp;<em>son vélo · son cartable</em><br>'
      +'\u{1F7E0} <strong>sont</strong> = verbe être (ils/elles) \u2192 remplaçable par <em>étaient</em><br>'
      +'&nbsp;&nbsp;&nbsp;&nbsp;<em>ils sont contents · elles sont parties</em>',

  exercices:[
    { type:'qcm', titre:'son ou sont ?', consigne:'Quel mot convient dans la phrase ?',
      items:[
        { phrase:'Les élèves ___ dans la cour.', q:'', bonne:'sont', options:['son','sont'],
          expl:'Les élèves <em>étaient</em> dans la cour \u2192 verbe être \u2192 <strong>sont</strong>.' },
        { phrase:'Tom range ___ cartable.', q:'', bonne:'son', options:['sont','son'],
          expl:'Tom range <em>mon</em> cartable \u2192 déterminant possessif \u2192 <strong>son</strong>.' },
        { phrase:'Elles ___ arrivées en retard.', q:'', bonne:'sont', options:['son','sont'],
          expl:'Elles <em>étaient</em> arrivées \u2192 verbe être \u2192 <strong>sont</strong>.' },
        { phrase:'Léa promène ___ chien.', q:'', bonne:'son', options:['sont','son'],
          expl:'Léa promène <em>ton</em> chien \u2192 déterminant possessif \u2192 <strong>son</strong>.' }
      ]},

    { type:'jugement', titre:'Repère la bonne phrase',
      consigne:'Tape directement sur la phrase correctement écrite.',
      items:[
        { consigne:'Quelle phrase est correcte ?',
          bonne:'Ils sont partis avec son ballon.',
          mauvaise:'Ils son partis avec sont ballon.',
          expl:'<em>Ils étaient partis</em> \u2192 sont. <em>mon ballon</em> \u2192 son.' },
        { consigne:'Quelle phrase est correcte ?',
          bonne:'Mon frère prend son goûter.',
          mauvaise:'Mon frère prend sont goûter.',
          expl:'<em>ton goûter</em> fonctionne \u2192 <strong>son</strong> (déterminant).' },
        { consigne:'Quelle phrase est correcte ?',
          bonne:'Les chats sont sur son lit.',
          mauvaise:'Les chats son sur sont lit.',
          expl:'<em>Les chats étaient</em> \u2192 sont. <em>mon lit</em> \u2192 son.' },
        { consigne:'Quelle phrase est correcte ?',
          bonne:'Elles sont contentes de son cadeau.',
          mauvaise:'Elles son contentes de sont cadeau.',
          expl:'<em>Elles étaient contentes</em> \u2192 sont. <em>mon cadeau</em> \u2192 son.' }
      ]},

    { type:'drag', titre:'Place le bon mot',
      consigne:'Tape sur son ou sont, puis tape sur la case dans la phrase.',
      pool:['son','sont','son','sont'],
      items:[
        { avant:'Papa gare', apres:'vélo.', rep:'son',
          expl:'<em>mon</em> vélo… on peut dire <em>mon</em>/<em>ton</em> \u2192 <strong>son</strong>.' },
        { avant:'Mes cousins', apres:'en vacances.', rep:'sont',
          expl:'Mes cousins <em>étaient</em> en vacances \u2192 <strong>sont</strong>.' },

      items:[

        { phrase:'Ses parents ___ très gentils.', rep:'sont',

        { phrase:'Marie prête ___ crayon.', rep:'son',
          expl:'<em>ton</em> crayon \u2192 son.' }
