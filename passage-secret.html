<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Le passage secret — L'Atelier du Devoir</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Luckiest+Guy&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Nunito',sans-serif;background:#f5f7fa;color:#1e293b;
  min-height:100vh;padding:18px 14px 50px;}
.wrap{max-width:860px;margin:0 auto;}

.retour{display:inline-block;color:#64748b;text-decoration:none;font-weight:700;
  font-size:.9rem;padding:8px 0;margin-bottom:6px;cursor:pointer;background:none;border:none;
  font-family:'Nunito',sans-serif;}
.retour:hover{color:#1e293b;}

header{text-align:center;margin-bottom:22px;}
header h1{margin:0;}
.logo-passage{display:block;width:min(78%,400px);height:auto;margin:0 auto;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.12));}
header p{color:#64748b;font-weight:700;font-size:.95rem;margin-top:6px;}

.banniere{display:block;width:100%;border-radius:20px;background:#fff;
  box-shadow:0 2px 12px rgba(30,41,59,.08);margin-bottom:26px;}

/* ── Écrans ── */
.ecran{display:none;}
.ecran.on{display:block;}

/* ── Verrou ── */
.verrou{background:#fff;border-radius:20px;padding:34px 24px;text-align:center;
  box-shadow:0 2px 12px rgba(30,41,59,.08);max-width:440px;margin:0 auto;}
.verrou .ico{font-size:2.6rem;display:block;margin-bottom:12px;}
.verrou h2{font-family:'Lilita One',cursive;font-weight:400;font-size:1.4rem;margin-bottom:10px;}
.verrou p{color:#64748b;font-weight:700;font-size:.92rem;line-height:1.6;}
.verrou a.btn{display:inline-block;margin-top:18px;background:#3b82f6;color:#fff;
  text-decoration:none;border-radius:999px;padding:12px 26px;
  font-family:'Luckiest Guy','Lilita One',cursive;font-weight:400;letter-spacing:1px;
  text-transform:uppercase;font-size:.9rem;}

/* ── Cartes enfants ── */
.enfants{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:640px){ .enfants{grid-template-columns:1fr;} }

.carte{display:block;width:100%;text-align:center;text-decoration:none;color:inherit;
  background:#fff;border-radius:20px;padding:26px 20px;cursor:pointer;
  box-shadow:0 2px 12px rgba(30,41,59,.08);border:2px solid transparent;
  font-family:'Nunito',sans-serif;
  transition:transform .18s, box-shadow .18s, border-color .18s;}
.carte:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(30,41,59,.14);}
.carte .ico{font-size:2.4rem;display:block;margin-bottom:10px;}
.carte .nom{font-family:'Lilita One',cursive;font-weight:400;font-size:1.5rem;
  letter-spacing:.5px;margin-bottom:4px;}
.carte .sous{color:#64748b;font-weight:700;font-size:.85rem;}
.carte .compte{display:inline-block;margin-top:14px;
  font-family:'Luckiest Guy','Lilita One',cursive;font-weight:400;letter-spacing:1px;
  text-transform:uppercase;font-size:.9rem;padding:7px 16px;border-radius:999px;}

.c-nina{border-color:#f0abfc;}
.c-nina:hover{border-color:#d946ef;}
.c-nina .compte{background:#fae8ff;color:#86198f;}

.c-raphael{border-color:#93c5fd;}
.c-raphael:hover{border-color:#3b82f6;}
.c-raphael .compte{background:#dbeafe;color:#1e40af;}

/* ── Liste des leçons ── */
.titre-enfant{font-family:'Lilita One',cursive;font-weight:400;font-size:1.6rem;
  text-align:center;margin-bottom:4px;}
.sous-enfant{text-align:center;color:#64748b;font-weight:700;font-size:.88rem;
  margin-bottom:20px;}

.lecon{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;
  padding:16px 18px;margin-bottom:12px;text-decoration:none;color:inherit;
  box-shadow:0 2px 10px rgba(30,41,59,.07);border-left:5px solid #cbd5e1;
  transition:transform .15s, box-shadow .15s;}
.lecon:hover{transform:translateX(3px);box-shadow:0 6px 18px rgba(30,41,59,.12);}
.lecon .l-ico{font-size:1.8rem;flex-shrink:0;}
.lecon .l-corps{flex:1;min-width:0;}
.lecon .l-titre{display:block;font-weight:800;font-size:1rem;line-height:1.35;}
.lecon .l-meta{display:block;color:#94a3b8;font-weight:700;font-size:.78rem;margin-top:3px;}
.lecon .l-fleche{color:#cbd5e1;font-size:1.3rem;font-weight:800;flex-shrink:0;}
.neuf{display:inline-block;background:#fef3c7;color:#b45309;border-radius:999px;
  padding:2px 9px;font-size:.7rem;font-weight:900;margin-left:7px;vertical-align:middle;}

.statut{display:inline-block;border-radius:999px;padding:3px 11px;font-size:.74rem;font-weight:900;
  white-space:nowrap;flex-shrink:0;}
.st-afaire{background:#e0e7ff;color:#3730a3;}
.st-refaire{background:#fee2e2;color:#b91c1c;}
.st-retravailler{background:#ffedd5;color:#c2410c;}
.st-acquis{background:#dcfce7;color:#15803d;}
@media (max-width:480px){ .lecon{flex-wrap:wrap;} .lecon .statut{order:3;margin-left:44px;} .lecon .l-fleche{display:none;} }

.vide-liste{background:#fff;border-radius:18px;padding:30px 22px;text-align:center;
  color:#94a3b8;font-weight:700;font-size:.92rem;line-height:1.7;
  box-shadow:0 2px 12px rgba(30,41,59,.07);}

.liens-bas{margin-top:24px;text-align:center;}
.liens-bas a{display:inline-block;color:#64748b;text-decoration:none;font-weight:800;
  font-size:.85rem;padding:9px 18px;border-radius:999px;background:#fff;margin:0 5px 8px;
  box-shadow:0 1px 6px rgba(30,41,59,.07);}
.liens-bas a:hover{color:#1e293b;}

.note{margin-top:28px;text-align:center;color:#94a3b8;font-size:.8rem;
  font-weight:600;line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">

  <a class="retour" href="index.html">← Retour à l'accueil</a>

  <header>
    <h1><img class="logo-passage" src="logo-passage-secret.webp" alt="Le passage secret"></h1>
    <p>Des leçons préparées rien que pour vous.</p>
  </header>

  <!-- Écran 0 : chargement -->
  <div class="ecran on" id="ec-chargement">
    <div class="vide-liste">Un instant…</div>
  </div>

  <!-- Écran 1 : accès refusé -->
  <div class="ecran" id="ec-verrou">
    <div class="verrou">
      <span class="ico">🔒</span>
      <h2 id="verrou-titre">Cette porte est fermée</h2>
      <p id="verrou-texte"></p>
      <a class="btn" id="verrou-lien" href="connexion.html">Se connecter</a>
    </div>
  </div>

  <!-- Écran 2 : choix de l'enfant -->
  <div class="ecran" id="ec-enfants">
    <img class="banniere" src="passage-secret.jpg"
         alt="Deux enfants courent vers une porte entrouverte que leur père tient ouverte">
    <div class="enfants" id="liste-enfants"></div>
    <p class="note">
      Les leçons de cet espace sont préparées à la maison,<br>
      à partir de ce qui a été vu en classe.
    </p>
  </div>

  <!-- Écran 3 : leçons d'un enfant -->
  <div class="ecran" id="ec-lecons">
    <button class="retour" onclick="PS.retourEnfants()">← Choisir un autre prénom</button>
    <div class="titre-enfant" id="titre-enfant"></div>
    <div class="sous-enfant" id="sous-enfant"></div>
    <div id="liste-lecons"></div>
    <div class="liens-bas">
      <a href="espace-parent.html">📊 Voir les résultats</a>
      <a href="mes-devoirs.html">📚 Mes devoirs</a>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var PS = (function(){
  var U = "https://rwqsvrmjjoihuhmvbwuu.supabase.co";
  var K = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ3cXN2cm1qam9paHVobXZid3V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNjQxNTMsImV4cCI6MjA5OTk0MDE1M30.VtdOnI169-erf48NpxLPCC0th6kHqBcsBuCauOx52HI";
  var DATA = null;
  var SB = null;
  var IDS = {};      // clé de l'enfant (nina…) → id du profil Supabase
  var NOTES = {};    // "idEnfant|P001" → meilleure note {score,total,pct,essais}
  var CLE_ACTIF = "atelier_enfant_actif";

  function el(id){ return document.getElementById(id); }
  function esc(s){ var d=document.createElement('div'); d.textContent = s==null?'':s; return d.innerHTML; }

  function ecran(id){
    ['ec-chargement','ec-verrou','ec-enfants','ec-lecons'].forEach(function(e){
      el(e).classList.toggle('on', e === id);
    });
  }

  function refuser(titre, texte, lien, libelle){
    el('verrou-titre').textContent = titre;
    el('verrou-texte').textContent = texte;
    var a = el('verrou-lien');
    a.href = lien; a.textContent = libelle;
    ecran('ec-verrou');
  }

  /* ── Contrôle d'accès ──
     La page est verrouillée côté base, pas côté JavaScript : est_admin() interroge
     Supabase, qui seul sait quels comptes sont autorisés. Rien n'est écrit en dur ici,
     et trafiquer le code de la page ne donne accès à rien. */
  async function demarrer(){
    try{
      if(typeof supabase === 'undefined'){
        refuser("Connexion impossible", "Vérifie ta connexion internet, puis recharge la page.",
                "passage-secret.html", "Réessayer");
        return;
      }
      var sb = supabase.createClient(U, K);
      var s = await sb.auth.getSession();
      if(!s.data.session){
        refuser("Cette porte est fermée",
                "Connecte-toi d'abord avec le compte de la famille pour pouvoir entrer.",
                "connexion.html", "Se connecter");
        return;
      }

      var r = await sb.rpc('est_admin');
      if(r.error || r.data !== true){
        refuser("Ce passage n'est pas pour ce compte",
                "Cet espace est réservé à une seule famille. Le reste du site, lui, est ouvert à tous !",
                "index.html", "Retour à l'accueil");
        return;
      }

      var rep = await fetch('passage-secret.json?v=' + Date.now());
      DATA = await rep.json();
      SB = sb;
      await chargerNotes();
      afficherEnfants();

    }catch(e){
      refuser("Quelque chose n'a pas fonctionné",
              "Recharge la page dans un instant.", "passage-secret.html", "Réessayer");
    }
  }

  /* ── Notes des leçons ──
     Chaque enfant du JSON est relié à son profil Supabase par son prénom
     (ou par "enfant_id" si on l'indique dans passage-secret.json).
     On garde la MEILLEURE note de chaque leçon : refaire la fiche ne peut que l'améliorer. */
  function norm(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }

  async function chargerNotes(){
    try{
      var re = await SB.from('enfants').select('id,prenom');
      if(re.error || !re.data) return;
      (DATA.enfants || []).forEach(function(e){
        if(e.enfant_id){ IDS[e.cle] = e.enfant_id; return; }
        var p = re.data.filter(function(x){ return norm(x.prenom) === norm(e.prenom); })[0];
        if(p) IDS[e.cle] = p.id;
      });
      var ids = Object.keys(IDS).map(function(k){ return IDS[k]; });
      var codes = (DATA.fiches || []).map(function(f){ return f.code; });
      if(!ids.length || !codes.length) return;
      var rp = await SB.from('progression').select('enfant_id,fiche_code,score,total')
                       .in('enfant_id', ids).in('fiche_code', codes);
      if(rp.error || !rp.data) return;
      rp.data.forEach(function(l){
        var k = l.enfant_id + '|' + l.fiche_code;
        var pct = l.total > 0 ? Math.round(l.score / l.total * 100) : 0;
        var n = NOTES[k];
        if(!n){ NOTES[k] = {score:l.score, total:l.total, pct:pct, essais:1}; return; }
        n.essais++;
        if(pct > n.pct){ n.score = l.score; n.total = l.total; n.pct = pct; }
      });
    }catch(e){ /* sans notes, la liste s'affiche quand même */ }
  }

  function noteDe(cle, code){ return IDS[cle] ? NOTES[IDS[cle] + '|' + code] : null; }

  function statutDe(cle, f){
    var n = noteDe(cle, f.code);
    if(!n) return {cls:'st-afaire', txt:'À faire', note:null};
    if(n.pct >= 80) return {cls:'st-acquis', txt:'Acquis ✓', note:n};
    if(n.pct >= 60) return {cls:'st-retravailler', txt:'À retravailler', note:n};
    return {cls:'st-refaire', txt:'À refaire', note:n};
  }

  // Le résultat de la fiche doit s'enregistrer sur le bon profil : on sélectionne l'enfant
  function choisir(cle){
    try{ if(IDS[cle]) localStorage.setItem(CLE_ACTIF, IDS[cle]); }catch(e){}
  }

  function fichesDe(cle){
    return (DATA.fiches || []).filter(function(f){ return f.pour === cle; });
  }

  function afficherEnfants(){
    el('liste-enfants').innerHTML = (DATA.enfants || []).map(function(e){
      var n = fichesDe(e.cle).length;
      var neuves = fichesDe(e.cle).filter(function(f){ return statutDe(e.cle, f).cls !== 'st-acquis'; }).length;
      return '<button class="carte c-' + esc(e.cle) + '" onclick="PS.ouvrir(\'' + esc(e.cle) + '\')">'
        + '<span class="ico">' + esc(e.emoji) + '</span>'
        + '<div class="nom">' + esc(e.prenom) + '</div>'
        + '<div class="sous">' + (n === 0 ? 'Rien de nouveau pour le moment'
            : n + (n > 1 ? ' leçons' : ' leçon') + (neuves ? ' · ' + neuves + ' à travailler' : ' · tout est acquis 🎉')) + '</div>'
        + '<span class="compte">Entrer</span></button>';
    }).join('');
    ecran('ec-enfants');
  }

  function ouvrir(cle){
    var e = (DATA.enfants || []).filter(function(x){ return x.cle === cle; })[0];
    if(!e) return;
    el('titre-enfant').textContent = e.emoji + ' ' + e.prenom;
    el('sous-enfant').textContent = e.classe ? 'Ses leçons préparées à la maison — ' + e.classe
                                             : 'Ses leçons préparées à la maison';

    var liste = fichesDe(cle);
    if(!liste.length){
      el('liste-lecons').innerHTML = '<div class="vide-liste">Aucune leçon ici pour l\'instant.<br>'
        + 'Elles arriveront bientôt !</div>';
    } else {
      el('liste-lecons').innerHTML = liste.map(function(f){
        var st = statutDe(cle, f), n = st.note;
        return '<a class="lecon" href="' + esc(f.fichier) + '" onclick="PS.choisir(\'' + esc(cle) + '\')"'
          + (f.couleur ? ' style="border-left-color:' + esc(f.couleur) + '"' : '') + '>'
          + '<span class="l-ico">' + esc(f.emoji || '📄') + '</span>'
          + '<span class="l-corps"><span class="l-titre">' + esc(f.titre)
          + (f.nouveau && !n ? '<span class="neuf">NOUVEAU</span>' : '') + '</span>'
          + '<span class="l-meta">' + esc(f.matiere || '')
          + (n ? ' · Meilleure note : ' + n.score + '/' + n.total + ' (' + n.pct + ' %)'
               + ' · ' + n.essais + (n.essais > 1 ? ' essais' : ' essai')
               : (f.ajoute_le ? ' · ' + esc(f.ajoute_le) : '')) + '</span></span>'
          + '<span class="statut ' + st.cls + '">' + st.txt + '</span>'
          + '<span class="l-fleche">→</span></a>';
      }).join('');
    }
    ecran('ec-lecons');
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function retourEnfants(){ ecran('ec-enfants'); window.scrollTo({top:0, behavior:'smooth'}); }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
  else demarrer();

  return { ouvrir: ouvrir, retourEnfants: retourEnfants, choisir: choisir };
})();
</script>
</body>
</html>
