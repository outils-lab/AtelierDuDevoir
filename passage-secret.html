<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Le passage secret — L'Atelier du Devoir</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Luckiest+Guy&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Nunito',sans-serif;background:#f5f7fa;color:#1e293b;
  min-height:100vh;padding:18px 14px 50px;}
.wrap{max-width:860px;margin:0 auto;}

.retour{display:inline-block;color:#64748b;text-decoration:none;font-weight:700;
  font-size:.9rem;padding:8px 0;margin-bottom:6px;}
.retour:hover{color:#1e293b;}

header{text-align:center;margin-bottom:22px;}
header h1{margin:0;}
.logo-passage{display:block;width:min(78%,400px);height:auto;margin:0 auto;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.12));}
header p{color:#64748b;font-weight:700;font-size:.95rem;margin-top:6px;}

.banniere{display:block;width:100%;border-radius:20px;background:#fff;
  box-shadow:0 2px 12px rgba(30,41,59,.08);margin-bottom:26px;}

.enfants{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:640px){ .enfants{grid-template-columns:1fr;} }

.carte{display:block;text-decoration:none;color:inherit;background:#fff;
  border-radius:20px;padding:26px 20px;text-align:center;
  box-shadow:0 2px 12px rgba(30,41,59,.08);border:2px solid transparent;
  transition:transform .18s, box-shadow .18s, border-color .18s;}
.carte:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(30,41,59,.14);}
.carte .ico{font-size:2.4rem;display:block;margin-bottom:10px;}
.carte .nom{font-size:1.35rem;font-weight:800;margin-bottom:4px;}
.carte .sous{color:#64748b;font-weight:700;font-size:.85rem;}
.carte .compte{display:inline-block;margin-top:14px;font-weight:800;font-size:.82rem;
  padding:7px 16px;border-radius:999px;}

.c-nina{border-color:#f0abfc;}
.c-nina:hover{border-color:#d946ef;}
.c-nina .compte{background:#fae8ff;color:#86198f;}

.c-raphael{border-color:#93c5fd;}
.c-raphael:hover{border-color:#3b82f6;}
.c-raphael .compte{background:#dbeafe;color:#1e40af;}

.note{margin-top:28px;text-align:center;color:#94a3b8;font-size:.8rem;
  font-weight:600;line-height:1.6;}
</style>
<style>/* Polices du site : Luckiest Guy (titres, boutons d'action), Lilita One (sous-titres, boutons), Nunito (texte) */
.carte .nom{font-family:'Lilita One',cursive;font-weight:400;font-size:1.5rem;letter-spacing:.5px;}
.carte .compte{font-family:'Luckiest Guy','Lilita One',cursive;font-weight:400;letter-spacing:1px;text-transform:uppercase;font-size:.9rem;}
</style>
</head>
<body>
<div class="wrap">

  <a class="retour" href="index.html">← Retour à l'accueil</a>

  <header>
    <h1><img class="logo-passage" src="logo-passage-secret.webp" alt="Le passage secret"></h1>
    <p>Des leçons préparées rien que pour vous.</p>
  </header>

  <img class="banniere" src="passage-secret.jpg"
       alt="Deux enfants courent vers une porte entrouverte que leur père tient ouverte">

  <div class="enfants">

    <a class="carte c-nina" href="mes-devoirs.html?enfant=nina">
      <span class="ico">📒</span>
      <div class="nom">Nina</div>
      <div class="sous">Ses leçons et ses exercices</div>
      <span class="compte">Entrer</span>
    </a>

    <a class="carte c-raphael" href="mes-devoirs.html?enfant=raphael">
      <span class="ico">📘</span>
      <div class="nom">Raphaël</div>
      <div class="sous">Ses leçons et ses exercices</div>
      <span class="compte">Entrer</span>
    </a>

  </div>

  <p class="note">
    Les leçons de cet espace sont préparées à la maison,<br>
    à partir de ce qui a été vu en classe.
  </p>

</div>
</body>
</html>
